<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>GYM-Pat · Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="GYM-Pat">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#0a0a12; --card:#15151f; --card2:#1f1f2e; --line:#33334a;
    --tx:#f3f0ee; --tx2:#b9b3ae; --tx3:#817b9a;
    --pk:#ff2d78; --cy:#00e5ff;
    --or:#ff2d78; --ok:#00e5ff; --bad:#ff2d78; --warn:#00e5ff; --blu:#00e5ff; --vio:#ff2d78;
    --sb: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--tx); overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:calc(150px + var(--sb));
    overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
  }
  h1,h2,h3{margin:0}
  button{font-family:inherit}

  /* ---------- cabecera ---------- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(10,10,11,.97);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:10px 12px 8px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .top{display:flex; align-items:center; gap:8px; min-width:0}
  .brand{font-weight:800; font-size:16px; letter-spacing:.5px; flex:0 0 auto}
  .pill{
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0
  }
  .pill.ph{margin-left:auto; color:var(--or); background:#2a1212; border:1px solid #5b1d1d}
  .modes{display:flex; gap:6px; margin-top:9px}
  .modes button{
    flex:1 1 0; min-width:0; padding:8px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--tx2); font-weight:700; font-size:13.5px; cursor:pointer
  }
  .modes button[aria-pressed=true]{background:var(--or); border-color:var(--or); color:#1a0210}
  .days{display:flex; gap:5px; margin-top:8px}
  .days button{
    flex:1 1 0; min-width:0; padding:8px 2px; border-radius:10px; position:relative;
    border:1px solid var(--line); background:var(--card); color:var(--tx2);
    font-weight:700; font-size:14px; cursor:pointer
  }
  .days button .dot{
    position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%;
    background:var(--ok); display:none
  }
  .days button.hoy .dot{display:block}

  /* ---------- contenedor ---------- */
  main{padding:12px 12px 4px; max-width:620px; margin:0 auto}
  .view{display:none}
  .view.on{display:block}

  .dayhead{border-radius:14px; padding:12px 14px; margin-bottom:10px}
  .dayhead h1{font-size:20px; letter-spacing:1px}
  .dayhead p{margin:2px 0 0; font-size:14px; opacity:.93}
  .banner{
    background:#06232a; border:1px solid #0097a8; color:#a3eefa;
    border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:11px
  }
  .banner.g{background:#06232a; border-color:#0097a8; color:#a3eefa}
  .banner.r{background:#2a1420; border-color:#7a1d4a; color:#ffc2de}
  .banner.b{background:#06232a; border-color:#0097a8; color:#a3eefa}
  .sect{font-size:12px; font-weight:800; color:var(--tx3); letter-spacing:1.2px; margin:16px 0 8px}

  /* ---------- barra de sesión ---------- */
  .sessbar{
    display:flex; gap:7px; align-items:center; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:9px 11px; margin-bottom:11px; font-size:13px
  }
  .sessbar .k{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums}
  .sessbar .k.over{color:var(--bad)}
  .sessbar .k.paused{opacity:.5}
  .sessbar .sep{flex:1}
  .sessbar button{
    padding:7px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:700; font-size:12.5px; cursor:pointer
  }
  .sessbar button.on{background:var(--ok); border-color:var(--ok); color:#06232a}
  .sessbar button.fin{background:var(--bad); border-color:var(--bad); color:#1a0210}

  /* ---------- ejercicios ---------- */
  .ex{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:11px; overflow:hidden}
  .ex.pr{border-color:#0097a8; box-shadow:inset 0 0 0 1px #0a3a40}
  .exhead{display:flex; gap:11px; padding:11px 12px 8px; align-items:flex-start}
  .thumb{width:60px; height:60px; flex:0 0 60px; background:var(--card2); border-radius:10px; padding:2px}
  .icon{width:100%; height:100%; display:block}
  .icon.big{width:100%; height:100%}
  .fig{stroke:#ece7e2; stroke-width:4.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .body{stroke:#ece7e2; fill:#ece7e2; stroke-linecap:round; stroke-linejoin:round}
  .head{fill:#ece7e2}
  /* ---- resalte muscular (solo vista ampliada) ---- */
  .musReg{stroke:none}
  .musBase{fill:#ece7e2; opacity:.16}
  .musP{fill:var(--or); opacity:1}
  .musS{fill:var(--ok); opacity:.72}
  .eq{stroke:var(--cy); stroke-width:4.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .eqc{stroke:var(--cy); stroke-width:4.4; fill:none}
  .pl{stroke:var(--cy); stroke-width:9; fill:none; stroke-linecap:round}
  .frame{stroke:#8a8278; stroke-width:4.2; fill:none; stroke-linecap:round}
  .dash{stroke:var(--cy); stroke-width:3; fill:none; stroke-dasharray:6 5; stroke-linecap:round}
  /* ---- animación de iconos (gesto en bucle) ---- */
  .icon .mv{transform-origin:0 0}
  .icon .mv-arms{animation:mvArms 1.4s ease-in-out infinite alternate}
  .icon .mv-legs{animation:mvLegs 1.5s ease-in-out infinite alternate}
  .icon .mv-torso{animation:mvTorso 1.6s ease-in-out infinite alternate}
  .icon .mv-breath{animation:mvBreath 2.6s ease-in-out infinite alternate}
  @keyframes mvArms{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  @keyframes mvLegs{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes mvTorso{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  @keyframes mvBreath{from{transform:scale(1)}to{transform:scale(1.025)}}
  .icon.big{width:100%; height:100%}
  .exmeta{min-width:0; flex:1}
  .exname{font-weight:700; font-size:15.5px; line-height:1.25}
  .extarget{font-size:15px; font-weight:800; margin-top:3px}
  .exmus{font-size:14px; font-weight:600; color:var(--tx2); margin-top:4px}
  .tag{
    font-size:10px; font-weight:800; color:var(--or); border:1px solid var(--or);
    background:#2a1212; padding:2px 6px; border-radius:999px; margin-left:5px;
    vertical-align:1px; letter-spacing:.3px; white-space:nowrap
  }
  .tag.sug{color:var(--ok); border-color:#0097a8; background:#06232a}
  .tag.prb{color:#00e5ff; border-color:#0097a8; background:#06232a}
  .exlast{font-size:12.5px; color:var(--tx3); margin-top:4px}
  .exlast b{color:var(--tx2); font-weight:700}
  .colheads{font-size:10.5px; color:var(--tx3); display:flex; gap:7px; padding:5px 12px 0}
  .colheads span:first-child{width:22px; flex:0 0 22px}
  .colheads span.c{flex:1 1 0; text-align:center}
  .colheads span.r{flex:0 0 40px}
  .sets{padding:0 12px 10px}
  .setrow{display:flex; align-items:center; gap:6px; margin-top:6px}
  .sn{width:22px; flex:0 0 22px; text-align:center; font-size:12px; font-weight:800; color:var(--tx3)}
  .setrow input{
    flex:1 1 0; min-width:0; height:42px; background:var(--card2); color:var(--tx);
    border:1px solid var(--line); border-radius:10px; padding:0 6px;
    font-size:16px; font-weight:700; text-align:center
  }
  .setrow input:focus{outline:2px solid var(--or); outline-offset:-2px}
  .setrow input.filled{border-color:#0097a8; background:#0e2024}
  .rest{
    flex:0 0 40px; width:40px; height:42px; border-radius:10px; cursor:pointer;
    background:var(--card2); border:1px solid var(--line); color:var(--or); font-size:16px
  }
  .exnote{border-top:1px solid var(--line); padding:8px 12px; font-size:12.5px; color:var(--tx3); background:#121214}

  /* ---------- genéricos ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:11px}
  .card h3{font-size:15px; margin-bottom:8px}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:11px}
  .kpis.three{grid-template-columns:repeat(3,1fr)}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 11px}
  .kpi .v{font-size:23px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11.5px; color:var(--tx3); margin-top:2px}
  .kpi .s{font-size:11px; color:var(--tx2); margin-top:3px}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row>*{flex:1 1 0; min-width:0}
  .btn{
    padding:11px 10px; border-radius:11px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:700; font-size:13.5px; cursor:pointer
  }
  .btn.pri{background:var(--or); border-color:var(--or); color:#1a0210}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#06232a}
  .btn.dgr{color:#fca5a5; border-color:#7f2222}
  .btn.sm{padding:7px 9px; font-size:12px}
  label.f{display:block; font-size:12px; color:var(--tx2); margin:11px 0 5px; font-weight:600}
  /* 16px como mínimo en campos: por debajo, iOS hace zoom al enfocar */
  input.f, select.f, textarea.f{
    width:100%; background:var(--card2); color:var(--tx); border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:16px; font-family:inherit
  }
  textarea.f{height:96px; font-size:16px; font-family:ui-monospace,Consolas,monospace}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .mini{font-size:11.5px; color:var(--tx3); margin-top:7px; line-height:1.4}
  details.block{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin:4px 0 12px}
  details.block summary{font-weight:700; cursor:pointer; font-size:14.5px}
  details.block ul{margin:9px 0 0; padding-left:18px; color:var(--tx2); font-size:13.5px}
  details.block li{margin-bottom:6px}

  /* ---------- listas / barras ---------- */
  .bar{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12.5px}
  .bar .nm{flex:0 0 84px; color:var(--tx2); font-weight:600}
  .bar .tr{flex:1 1 0; height:16px; background:var(--card2); border-radius:8px; position:relative; overflow:hidden}
  .bar .fi{position:absolute; left:0; top:0; bottom:0; border-radius:8px; background:var(--blu)}
  .bar .fi.lo{background:#0097a8}
  .bar .fi.hi{background:var(--warn)}
  .bar .zone{position:absolute; top:0; bottom:0; background:rgba(0,229,255,.14); border-left:1px solid #0097a8; border-right:1px solid #0097a8}
  .bar .vl{flex:0 0 52px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
  .lst{font-size:13.5px}
  .lst .it{display:flex; gap:9px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
  .lst .it:last-child{border-bottom:0}
  .lst .it .g{flex:1 1 0; min-width:0}
  .lst .it .t{font-weight:700; font-size:13.5px}
  .lst .it .d{font-size:11.5px; color:var(--tx3)}
  .lst .it .n{font-weight:800; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .up{color:var(--ok)} .dn{color:var(--bad)} .fl{color:var(--tx3)}

  /* ---------- calendario ---------- */
  .calnav{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .calnav .m{flex:1 1 0; text-align:center; font-weight:800; font-size:15px}
  .calnav button{flex:0 0 40px; padding:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--tx); cursor:pointer; font-weight:800}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal .dw{text-align:center; font-size:10.5px; color:var(--tx3); font-weight:700; padding-bottom:2px}
  .cal .cd{
    aspect-ratio:1/1.12; border:1px solid var(--line); background:var(--card); border-radius:9px;
    padding:3px 0 0; position:relative; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; gap:2px
  }
  .cal .cd.void{background:transparent; border-color:transparent; cursor:default}
  .cal .cd.today{border-color:var(--or)}
  .cal .cd .n{font-size:11.5px; font-weight:700; color:var(--tx2)}
  .cal .cd .mk{display:flex; gap:2px}
  .cal .cd .mk i{width:5px; height:5px; border-radius:50%; display:block}
  .mk i.g{background:var(--blu)} .mk i.b{background:var(--bad)} .mk i.a{background:var(--vio)}
  .leg{display:flex; gap:12px; font-size:11.5px; color:var(--tx3); margin-top:9px; flex-wrap:wrap}
  .leg span{display:flex; align-items:center; gap:5px}
  .leg i{width:7px; height:7px; border-radius:50%; display:block}

  /* ---------- gráficas ---------- */
  .chart{width:100%; height:150px; display:block}
  .chart .ax{stroke:#3d3d47; stroke-width:1}
  .chart .gl{stroke:#26262e; stroke-width:1}
  .chart .ln{fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .chart .ar{fill-opacity:.14}
  .chart .pt{stroke:#0a0a12; stroke-width:1.5}
  .chart text{fill:#817b9a; font-size:10px}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:7px; margin-bottom:4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx2); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap
  }
  .chip[aria-pressed=true]{background:var(--or); border-color:var(--or); color:#1a0210}

  /* ---------- barra inferior ---------- */
  .timerbar{
    position:fixed; left:0; right:0; bottom:calc(58px + var(--sb)); z-index:29;
    background:rgba(16,16,19,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    padding:8px 12px; display:flex; align-items:center; gap:7px; max-width:620px; margin:0 auto
  }
  .tdisp{font-variant-numeric:tabular-nums; font-weight:800; font-size:22px; flex:0 0 60px}
  .tdisp.run{color:var(--ok)} .tdisp.done{color:var(--or)}
  .timerbar button{
    flex:1 1 0; min-width:0; padding:10px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:800; font-size:13px; cursor:pointer
  }
  .timerbar button.stop{flex:0 0 40px; color:var(--tx3)}
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
    background:rgba(10,10,11,.99); border-top:1px solid var(--line);
    padding-bottom:var(--sb); max-width:620px; margin:0 auto
  }
  nav.tabs button{
    flex:1 1 0; min-width:0; background:none; border:0; color:var(--tx3); cursor:pointer;
    padding:8px 0 9px; font-size:10.5px; font-weight:700; display:flex; flex-direction:column;
    align-items:center; gap:3px
  }
  nav.tabs button b{font-size:17px; line-height:1; font-weight:400}
  nav.tabs button[aria-pressed=true]{color:var(--or)}

  dialog{
    border:1px solid var(--line); background:var(--card); color:var(--tx);
    border-radius:16px; padding:0; width:min(560px,94vw); max-height:88vh
  }
  dialog::backdrop{background:rgba(0,0,0,.66)}
  .dlg{padding:15px}
  .dlg h2{font-size:17px; margin-bottom:4px}
  .foot{text-align:center; color:var(--tx3); font-size:11.5px; padding:4px 0 12px}
  .hide{display:none !important}

  /* ---- vista ampliada del ejercicio ---- */
  .exoview{display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px}
  .exobig{width:240px; height:240px; max-width:70vw; max-height:70vw; background:var(--card2); border-radius:16px; padding:10px}
  .exoview h2{margin:8px 0 0}
  .exoview .extarget{font-size:18px}

  /* ---- avatar (perfil fijo GYM-Pat) ---- */
  .avatar{width:44px; height:44px; border-radius:50%; overflow:hidden; background:var(--card2); flex:0 0 auto}
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar.lg{width:64px; height:64px}
  .avatar.sm{width:28px; height:28px}
  .avini{display:flex; align-items:center; justify-content:center; width:100%; height:100%; background:var(--or); color:#1a0210; font-weight:800}
  .idcard{margin-top:0}
  .idrow{display:flex; gap:12px; align-items:center}
  .idmeta{flex:1; min-width:0}

  @media (prefers-reduced-motion: reduce){ .icon .mv{animation:none} }

  /* ---- entrenamiento guiado a pantalla completa ---- */
  .bigcta{display:block; width:100%; margin-top:9px; padding:14px 0; border-radius:12px;
    border:1px solid var(--ok); background:var(--ok); color:#06232a; font-weight:800; font-size:16px; cursor:pointer}
  .guided{position:fixed; inset:0; z-index:60; background:var(--bg); color:var(--tx);
    display:flex; flex-direction:column; max-width:620px; margin:0 auto}
  .g-head{display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
    border-bottom:1px solid var(--line); background:var(--card)}
  .g-clock{font-weight:800; font-variant-numeric:tabular-nums; font-size:16px; color:var(--ok)}
  .g-clock.paused{opacity:.5}
  .g-pos{font-size:12.5px; color:var(--tx3)}
  .g-sep{flex:1}
  .g-fin{padding:7px 11px; border-radius:9px; border:1px solid var(--or);
    background:var(--or); color:#1a0210; font-weight:800; font-size:12.5px; cursor:pointer}
  .g-ico{background:var(--card2); border:1px solid var(--line); color:var(--tx);
    border-radius:9px; width:36px; height:36px; font-size:15px; cursor:pointer}
  .g-body{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; align-items:center; gap:10px}
  .g-exobig{width:220px; height:220px; max-width:62vw; max-height:62vw;
    background:var(--card2); border-radius:16px; padding:10px; cursor:pointer}
  .gbig{width:100%; height:100%; display:block}
  .g-exname{font-weight:800; font-size:19px; text-align:center}
  .g-extarget{font-size:16px; color:var(--tx2); text-align:center}
  .g-exinfo{font-size:13px; color:var(--tx2); text-align:center; max-width:360px}
  .g-exinfo .warn{color:var(--warn)}
  .g-restnum{font-size:68px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ok)}
  .g-restname{font-size:15px; color:var(--tx2); text-align:center}
  .g-skip{padding:12px 18px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:800; font-size:15px; cursor:pointer}
  .g-foot{display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line); background:var(--card)}
  .g-foot button{flex:1; padding:13px 0; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:800; font-size:15px; cursor:pointer}
  .g-foot button:disabled{opacity:.4}
  .g-foot button#gNext[data-last="1"]{background:var(--or); border-color:var(--or); color:#1a0210}
  .g-setrow{display:flex; align-items:center; gap:8px; width:100%; max-width:360px;
    padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:var(--card2)}
  .g-setrow .sn{flex:0 0 auto; color:var(--tx3); font-weight:700; font-size:13px}
  .g-setrow input{flex:1; min-width:0}
  .g-setrow.setdone{outline:1px solid var(--ok); outline-offset:1px}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">GYM-Pat</div>
    <div class="pill ph" id="phase">–</div>
  </div>

<script>
"use strict";

/* ============================= pictogramas ============================= */
const pp=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;return[-dy/L,dx/L];};
const ln=(c,x1,y1,x2,y2)=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const pl=(c,p)=>`<polyline class="${c}" points="${p}"/>`;
const pa=(c,d)=>`<path class="${c}" d="${d}"/>`;
const hd=(x,y,r=7)=>`<circle class="head" cx="${x}" cy="${y}" r="${r}"/>`;
const fl=(y=90)=>ln('frame',6,y,94,y);
function db(x1,y1,x2,y2,p=13){const[px,py]=pp(x1,y1,x2,y2),h=p/2;let s=ln('eq',x1,y1,x2,y2);
  for(const[ex,ey]of[[x1,y1],[x2,y2]])s+=ln('pl',(ex-px*h).toFixed(1),(ey-py*h).toFixed(1),(ex+px*h).toFixed(1),(ey+py*h).toFixed(1));return s;}
function bb(x1,y1,x2,y2,p=16,i=.12){const[px,py]=pp(x1,y1,x2,y2),h=p/2;let s=ln('eq',x1,y1,x2,y2);
  for(const t of[i,1-i]){const ex=x1+(x2-x1)*t,ey=y1+(y2-y1)*t;
    s+=ln('pl',(ex-px*h).toFixed(1),(ey-py*h).toFixed(1),(ex+px*h).toFixed(1),(ey+py*h).toFixed(1));}return s;}
function ar(x1,y1,x2,y2,s=5){const a=Math.atan2(y2-y1,x2-x1),a1=a+2.618,a2=a-2.618;
  return ln('eq',x1,y1,x2,y2)+pl('eq',`${(x2+s*Math.cos(a1)).toFixed(1)},${(y2+s*Math.sin(a1)).toFixed(1)} ${x2},${y2} ${(x2+s*Math.cos(a2)).toFixed(1)},${(y2+s*Math.sin(a2)).toFixed(1)}`);}
const mv=(c,s)=>`<g class="mv ${c}">${s}</g>`;

/* ===== siluetas humanas con volumen (helpers paramétricos) ===== */
/* radianes desde "abajo" (0°) en sentido horario */
const rad=d=>(d-90)*Math.PI/180;
/* recorte al margen seguro del viewBox */
const cl=v=>Math.max(6,Math.min(94,v));
/* extremo de un segmento, redondeado y recortado a [6..94] */
const tip=(x,y,a,l)=>[cl(+(x+l*Math.cos(rad(a))).toFixed(1)), cl(+(y+l*Math.sin(rad(a))).toFixed(1))];
/* cápsula rellena (segmento con volumen) entre dos puntos */
const limb=(x1,y1,x2,y2,w=7)=>`<path class="body" d="M${x1} ${y1}L${x2} ${y2}" stroke-width="${w}"/>`;
/* cabeza lisa sin rostro (óvalo) */
const bhead=(x,y,r=7)=>`<ellipse class="head" cx="${x}" cy="${y}" rx="${r}" ry="${(r*1.12).toFixed(1)}"/>`;
/* tronco: cápsula ancha entre hombros y cadera */
const btorso=(sx,sy,hx,hy,w=15)=>`<path class="body" d="M${sx} ${sy}L${hx} ${hy}" stroke-width="${w}"/>`;
/* banda pélvica que une las dos caderas */
const bhip=(x,y,w=19,t=9)=>`<path class="body" d="M${cl(x-w/2).toFixed(1)} ${y}L${cl(x+w/2).toFixed(1)} ${y}" stroke-width="${t}"/>`;
/* brazo de 2 segmentos (hombro->codo->mano) con equipo opcional en la mano */
function arm(sx,sy,shAng,elAng,upper,fore,w,gearFn){
  upper=upper||15; fore=fore||14; w=w||6;
  const [ex,ey]=tip(sx,sy,shAng,upper);
  const [hx,hy]=tip(ex,ey,shAng+elAng,fore);
  const base=limb(sx,sy,ex,ey,w)+limb(ex,ey,hx,hy,w)+`<circle class="body" cx="${hx}" cy="${hy}" r="${(w/2).toFixed(1)}"/>`;
  const gear=gearFn?gearFn(hx,hy,ex,ey):'';
  return {svg:base+gear, hand:[hx,hy], elbow:[ex,ey]};
}
/* pierna de 2 segmentos (cadera->rodilla->pie) con equipo opcional en el pie */
function leg(hx,hy,hipAng,kneeAng,thigh,shin,w,gearFn){
  thigh=thigh||18; shin=shin||17; w=w||8;
  const [kx,ky]=tip(hx,hy,hipAng,thigh);
  const [fx,fy]=tip(kx,ky,hipAng+kneeAng,shin);
  const base=limb(hx,hy,kx,ky,w)+limb(kx,ky,fx,fy,w);
  const gear=gearFn?gearFn(fx,fy,kx,ky):'';
  return {svg:base+gear, foot:[fx,fy], knee:[kx,ky]};
}
const POSE0={cx:50, sy:30, hipY:60, headR:7, torsoW:15,
  armL:[205,25], armR:[155,-25],
  legL:[185,8],  legR:[175,-8],
  move:[], moveClass:null, moveMap:null, rig:null, armsFollowTorso:false};
const autoMvClass=name=> name==='torso'?'mv-torso' : (name==='legL'||name==='legR')?'mv-legs' : 'mv-arms';
const moveClassOf=(p,name)=> (p.moveMap&&p.moveMap[name]) || p.moveClass || autoMvClass(name);
/* envoltura de pivote: 3 grupos; el .mv queda SIN atributo transform */
function pivot(cls, inner, ox, oy){
  return `<g transform="translate(${ox} ${oy})"><g class="mv ${cls}"><g transform="translate(${-ox} ${-oy})">${inner}</g></g></g>`;
}
/* silueta humana con volumen a partir de una pose declarativa */
function body(p){
  p=Object.assign({},POSE0,p);
  const R = p.rig||{};
  const S = p.sh || [p.cx, p.sy];
  const H = p.hp || [p.cx, p.hipY];
  const aL=arm(S[0]-3,S[1]+1,p.armL[0],p.armL[1],15,14,6,R.armL);
  const aR=arm(S[0]+3,S[1]+1,p.armR[0],p.armR[1],15,14,6,R.armR);
  const lL=leg(H[0]-5,H[1],p.legL[0],p.legL[1],18,17,8,R.legL);
  const lR=leg(H[0]+5,H[1],p.legR[0],p.legR[1],18,17,8,R.legR);
  const bar = (R.bar) ? R.bar(aL.hand, aR.hand) : '';
  const w=(name,part,ox,oy)=> p.move.indexOf(name)>=0 ? pivot(moveClassOf(p,name),part,ox,oy) : part;
  const headSvg = bhead(S[0], cl(S[1]-p.headR-2), p.headR);
  const torsoSvg = btorso(S[0],S[1],H[0],H[1],p.torsoW);
  let svg;
  if(p.armsFollowTorso){
    const trunk = torsoSvg + aL.svg + aR.svg + bar;
    svg = bhip(H[0],H[1],p.torsoW+4)
      + w('legL',lL.svg,H[0]-5,H[1]) + w('legR',lR.svg,H[0]+5,H[1])
      + w('torso', trunk, S[0], S[1])
      + headSvg;
  } else {
    svg = bhip(H[0],H[1],p.torsoW+4)
      + w('legL',lL.svg,H[0]-5,H[1]) + w('legR',lR.svg,H[0]+5,H[1])
      + w('torso', torsoSvg, S[0], S[1])
      + w('armL',aL.svg,S[0]-3,S[1]+1) + w('armR',aR.svg + bar,S[0]+3,S[1]+1)
      + headSvg;
  }
  return {svg, hands:[aL.hand,aR.hand], feet:[lL.foot,lR.foot]};
}

/* ===== silueta anatómica de referencia + resalte muscular (vista ampliada) ===== */
/* estado de color de una región según principal/secundarios */
const musState=(g,primary,secondary)=> g===primary?'musP' : (secondary.indexOf(g)>=0?'musS':'musBase');
/* 11 regiones pintables (coordenadas finales del viewBox); solo class, nunca id */
function regions(primary,secondary){
  secondary=secondary||[];
  const st=g=>musState(g,primary,secondary);
  const one=(g,cx,cy,rx,ry)=>`<ellipse class="musReg r-${g} ${st(g)}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
  const ell=one;
  const two=(g,ax,bx,cy,rx,ry)=>one(g,ax,cy,rx,ry)+one(g,bx,cy,rx,ry);
  /* frontal (eje x≈26) */
  return ell('cuello',26,22,2.6,2.6)
    +two('hombro',16,36,28,3.4,3)
    +ell('pecho',26,35,7,4.5)
    +two('biceps',15,37,38,2.4,4)
    +ell('core',26,49,6,6.5)
    +ell('cuadriceps',26,68,7,8)
    /* dorsal (eje x≈74) */
    +ell('trapecio',74,29,7,3)
    +ell('espalda',74,41,7.5,8)
    +two('triceps',63,85,39,2.4,4)
    +ell('gluteo',74,57,7.5,3.5)
    +ell('femoral',74,67,7,7);
}
function anatomy(primary,secondary){
  const man = body(Object.assign({}, POSE0, {cx:50, sy:28, hipY:58, move:[]})).svg;
  const front = `<g transform="translate(-10 6) scale(0.72)">${man}</g>`;
  const back  = `<g transform="translate(38 6) scale(0.72)">${man}</g>`;
  return front + back + regions(primary,secondary);
}

/* mancuerna sostenida en una mano (sigue a la mano al animar vía rig) */
const dbHand=(hx,hy)=>db(hx-6,hy,hx+6,hy,10);
/* barra única entre las dos manos */
const barHands=(hL,hR)=>bb(hL[0],hL[1],hR[0],hR[1]);
/* disco/agarre sostenido entre las dos manos (overhead) */
const discHands=(hL,hR)=>db((hL[0]+hR[0])/2-4,(hL[1]+hR[1])/2,(hL[0]+hR[0])/2+4,(hL[1]+hR[1])/2,12);

const IC={
 hipthrust_machine: fl(92)+ln('frame',10,46,46,46)+ln('frame',16,46,16,92)+ln('frame',40,46,40,92)
   +ln('frame',46,34,46,52)
   +(function(){var b=body({sh:[24,50],hp:[58,54],move:['torso'],armsFollowTorso:true});
     return b.svg+ln('eqc',44,40,44,52);})(),
 hipthrust_uni: fl(92)+ln('frame',10,46,46,46)+ln('frame',16,46,16,92)+ln('frame',40,46,40,92)
   +(function(){var b=body({sh:[24,50],hp:[58,54],legL:[70,0],legR:[185,30],
       move:['torso','legL'],moveMap:{torso:'mv-torso',legL:'mv-legs'},armsFollowTorso:true});
     return b.svg;})()
   +pa('dash','M 70,36 Q 76,28 82,30')+ar(79,29,82,30),
 bulgarian_split: fl(92)+ln('frame',66,62,92,62)+ln('frame',80,62,80,92)
   +body({sh:[34,30],hp:[38,56],legL:[195,55],legR:[150,28],move:['legL','legR']}).svg,
 rdl_uni: fl(93)+body({sh:[46,32],hp:[46,58],legL:[180,8],legR:[160,55],
     move:['torso','legR'],moveMap:{torso:'mv-torso',legR:'mv-legs'},armsFollowTorso:true,
     rig:{armR:dbHand}}).svg,
 abductor_machine: fl(93)+ln('frame',14,60,60,60)+ln('eqc',56,60,74,42)
   +body({sh:[26,46],hp:[26,60],legL:[95,-55],legR:[95,55],move:['legL','legR']}).svg,
 glute_kickback: fl(93)+ln('frame',16,66,52,66)+ln('eq',48,66,70,52)
   +body({sh:[30,34],hp:[30,56],legL:[0,80],legR:[0,-15],move:['legL']}).svg,
 squat_barbell: fl(93)
   +(function(){var b=body({legL:[190,42],legR:[170,-42],move:['legL','legR']});
     return b.svg+bb(22,27,78,27);})(),
 rdl_bar: fl(93)
   +body({sh:[50,34],hp:[50,60],move:['torso'],armsFollowTorso:true,rig:{bar:barHands}}).svg,
 legcurl_lying: fl(93)+ln('frame',16,62,74,62)
   +body({sh:[70,55],hp:[30,55],legL:[0,70],legR:[0,-70],move:['legL','legR']}).svg,
 legcurl_seated: fl(93)+ln('frame',14,66,14,90)+ln('frame',14,66,60,66)
   +body({sh:[30,46],hp:[30,66],legL:[90,-60],legR:[90,60],move:['legL','legR']}).svg
   +'<circle class="eqc" cx="78" cy="56" r="6"/>',
 squat_sumo: fl(93)+body({legL:[205,55],legR:[155,-55],move:['legL','legR']}).svg
   +db(44,58,56,58,12),
 lunge_multi: fl(92)+body({sh:[46,30],hp:[46,56],legL:[200,60],legR:[150,30],move:['legL','legR'],
     rig:{armL:dbHand,armR:dbHand}}).svg
   +pa('dash','M 18,50 A 30 30 0 0 1 24,30')+ar(23,31,24,30),
 legext_machine: fl(93)+ln('frame',24,32,24,64)+ln('frame',24,64,52,64)
   +body({sh:[30,34],hp:[30,56],legL:[90,-60],legR:[90,60],move:['legL','legR']}).svg
   +'<circle class="eqc" cx="80" cy="50" r="6"/>',
 squat_sissy: fl(93)+ln('frame',66,30,66,78)
   +body({sh:[50,30],hp:[50,56],legL:[160,55],legR:[150,38],move:['legL','legR']}).svg,
 lunge_smith: fl(92)+ln('frame',14,16,86,16)+ln('frame',18,16,18,8)+ln('frame',82,16,82,8)
   +body({sh:[46,30],hp:[46,56],legL:[200,60],legR:[150,30],move:['legL','legR'],
     rig:{bar:barHands}}).svg,
 chest_press: fl(93)+ln('frame',28,14,86,14)+ln('frame',86,14,86,93)
   +ln('eq',80,34,80,58)+ln('eq',80,46,86,30)
   +body({armL:[270,-15],armR:[270,15],move:['armL','armR']}).svg,
 row_machine: fl(93)+ln('frame',86,18,86,92)+ln('eq',86,30,70,46)
   +body({armL:[250,30],armR:[290,-30],move:['armL','armR']}).svg,
 pulldown: ln('eq',14,14,86,14)+ln('frame',18,14,18,7)+ln('frame',82,14,82,7)
   +body({sh:[50,30],hp:[50,62],armL:[195,0],armR:[165,0],move:['armL','armR']}).svg,
 lateral_raise_db: body({armL:[250,0],armR:[290,0],move:['armL','armR'],rig:{armL:dbHand,armR:dbHand}}).svg,
 curl_biceps: body({armL:[185,-110],armR:[175,110],move:['armL','armR'],rig:{bar:barHands}}).svg,
 triceps_ext: fl(93)+ln('frame',88,14,88,93)+ln('eq',88,22,62,40)
   +body({armL:[200,-30],armR:[160,30],move:['armL','armR']}).svg,
 generic: body({}).svg
};
const ICN=Object.keys(IC);

/* =============================== plan base ============================== */
/* m: contribución por serie a cada grupo muscular (1 = serie completa) */
function planBase(){return{gym:[
 {k:'lun',d:'LUNES',f:'Glúteo · Empuje de cadera',c:'#ff2d78',n:'Calentamiento 8 min: puente de glúteo con banda + almeja + caminata lateral con mini band.',e:[
  {n:'Hip Thrust en máquina',s:5,r:'8-10',i:'hipthrust_machine',t:'',rest:120,o:'Ajusta respaldo y rodillo antes de empezar. Pausa 2 s arriba apretando glúteo al máximo. Mentón metido, sin hiperextender lumbar. Última serie al fallo (RIR 0).',m:{gluteo:1,femoral:.3}},
  {n:'Hip Thrust unilateral',s:4,r:'10-12 /pierna',i:'hipthrust_uni',t:'',rest:75,o:'Pierna libre flexionada en el aire, sin apoyar. Controla que la cadera no rote hacia el lado de apoyo. Sube con el talón de apoyo.',m:{gluteo:1,femoral:.3}},
  {n:'Sentadilla búlgara',s:4,r:'10-12 /pierna',i:'bulgarian_split',t:'',rest:90,o:'Mancuernas o barra en la espalda. Pie trasero elevado en banco. Torso ligeramente inclinado adelante para más énfasis en glúteo. Bajar hasta rodilla casi al suelo.',m:{gluteo:1,cuadriceps:.6}},
  {n:'Peso muerto unilateral',s:4,r:'10-12 /pierna',i:'rdl_uni',t:'',rest:90,o:'Mancuerna o kettlebell en mano contraria a la pierna de apoyo. Espalda neutra, cadera atrás, rodilla de apoyo con ligera flexión. Foco en isquio-glúteo, sin redondear espalda.',m:{femoral:1,gluteo:.6}},
  {n:'Abductores en máquina',s:4,r:'15-20',i:'abductor_machine',t:'DROP',rest:60,o:'Tronco ligeramente inclinado adelante para más implicación glúteo medio. Contracción máxima 1-2 s en la apertura. Última serie: dropset -20% peso.',m:{gluteo:.6}},
  {n:'Patada de glúteo',s:4,r:'15 /pierna',i:'glute_kickback',t:'SS',rest:60,o:'Cadera estable, sin arquear lumbar para "ganar" rango. Extensión completa de cadera, aprieta glúteo arriba 1 s. Superserie con abductores.',m:{gluteo:1}}
 ]},

const MUS=['pecho','espalda','hombro','biceps','triceps','cuadriceps','femoral','gluteo','trapecio','core','cuello'];
const MUSL={pecho:'Pecho',espalda:'Espalda',hombro:'Hombro',biceps:'Bíceps',triceps:'Tríceps',
  cuadriceps:'Cuádriceps',femoral:'Femoral',gluteo:'Glúteo',trapecio:'Trapecio',core:'Core',cuello:'Cuello'};

const MUST={pecho:[10,18],espalda:[10,18],hombro:[10,20],biceps:[8,16],triceps:[8,16],
  cuadriceps:[8,14],femoral:[6,12],gluteo:[6,12],trapecio:[4,10],core:[8,20],cuello:[2,6]};

/* función pura: dado el mapa m del ejercicio, devuelve principal, secundarios y texto */
function muscles(m){
  const keys = (m && typeof m==='object') ? Object.keys(m).filter(k=>MUS.indexOf(k)>=0 && m[k]>0) : [];
  if(!keys.length) return {primary:null, secondary:[], label:'Movilidad / sin carga'};
  const rank = a=>MUS.indexOf(a);
  const primary = keys.reduce((best,k)=>
      (m[k]>m[best] || (m[k]===m[best] && rank(k)<rank(best))) ? k : best, keys[0]);
  const secondary = keys.filter(k=>k!==primary)
      .sort((a,b)=> (m[b]-m[a]) || (rank(a)-rank(b)));
  const label = 'Trabaja: ' + [primary].concat(secondary).map(k=>MUSL[k]).join(', ');
  return {primary, secondary, label};
}

  $('#dExo').showModal();

function blankDB(){

function ensureDB(d){
  if(!d.blocks || !d.blocks.length) d.blocks=[{id:1,name:'Bloque 1',start:'',plan:planBase()}];
  d.blocks.forEach(b=>{ if(!b.plan) b.plan=planBase(); });

  if(d.ab==null || d.ab<0 || d.ab>d.blocks.length-1) d.ab=0;
  return d;
}

function normalizeProfiles(){
  if(!PROFS || !Array.isArray(PROFS.profiles) || !PROFS.profiles.length){
    PROFS={profiles:[{id:uid(),name:'Perfil 1',photo:'',db:blankDB()}],current:null};
  }
  PROFS.profiles.forEach(p=>{

    if(typeof p.name!=='string' || !p.name.trim()) p.name='Perfil';
    if(typeof p.photo!=='string') p.photo='';
    if(!p.db || typeof p.db!=='object') p.db=blankDB();
    ensureDB(p.db);
  });
  if(!PROFS.profiles.some(p=>p.id===PROFS.current)) PROFS.current=null;
}
function migrateInto(d){
  try{
    const r=localStorage.getItem(OLD); if(!r) return;
    const o=JSON.parse(r); if(!o||!o.log) return;
    if(o.cycleStart&&!d.profile.cycleStart) d.profile.cycleStart=o.cycleStart;
    Object.keys(o.log).forEach(day=>{
      d.log[day]=d.log[day]||{ex:{}};
      Object.keys(o.log[day]).forEach(k=>{ d.log[day].ex[k]=o.log[day][k]; });
    });
    LEGACY_V1_IMPORTED=true;
  }catch(e){}
}
function migrateSingleToProfiles(){
  let d = blankDB();
  let hadV2=false;
  try{
    const r=localStorage.getItem(KEY);
    if(r){ const o=JSON.parse(r); d=Object.assign(d,o); hadV2=true; }
  }catch(e){}
  ensureDB(d);
  if(!d.migrated){ migrateInto(d); d.migrated=1; }
  const hadData = hadV2 || LEGACY_V1_IMPORTED;
  let name;
  if(hadData) name='Borja R.';
  else        name='Perfil 1';
  const id=uid();
  return { profiles:[{id, name, photo:'', db:d}], current:id };
}
function mountProfile(id){
  const p = PROFS.profiles.find(x=>x.id===id) || PROFS.profiles[0];
  PROFS.current = p.id;
  ensureDB(p.db);
  DB = p.db;
  MOUNTED = true;
  mode='gym'; day=todayK(); view='hoy'; calM=null; proEx=null;
  saveProfiles();
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(PK); }catch(e){}
  if(raw){
    try{
      const c=JSON.parse(raw);
      if(c && Array.isArray(c.profiles) && c.profiles.length){
        PROFS=c;
        normalizeProfiles();
        return;
      }
    }catch(e){ /* contenedor corrupto: cae a reconstrucción */ }
  }
  PROFS = migrateSingleToProfiles();
  saveProfiles();
}

  PROFS.profiles[i].db = DB;

function processPhoto(file, cb){
  if(!file || !/^image\//.test(file.type)){ toast('Elige una imagen válida'); cb(''); return; }
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
    try{
      const S=256, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
      const g=cv.getContext('2d');
      const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2, sy=(img.height-side)/2;
      g.drawImage(img, sx,sy, side,side, 0,0, S,S);
      const data=cv.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(url);
      cb(data);
    }catch(e){ URL.revokeObjectURL(url); toast('No se pudo procesar la imagen'); cb(''); }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('No se pudo leer la imagen'); cb(''); };
  img.src=url;
}

function cyc(){

  const d=dif(TODAY(),cs); if(d<0) return null;
  const wa=Math.floor(d/7)+1;
  return {wa,block:Math.floor((wa-1)/9)+1,w:((wa-1)%9)+1};
}
function fase(){ const c=cyc(); if(!c) return null; return FASES.filter(x=>c.w<=x.w)[0]||FASES[3]; }

/* -------------------------- fuerza y progresión ------------------------- */
const e1rm=(kg,reps)=>(kg>0&&reps>0)?kg*(1+reps/30):0;
function bestSet(sets){
  let b=null;
  (sets||[]).forEach(s=>{
    if(!s) return; const kg=nm(s.kg),rp=nm(s.reps); if(!kg||!rp) return;
    const e=e1rm(kg,rp); if(!b||e>b.e) b={kg,reps:rp,e};
  });
  return b;
}
/* historial de un ejercicio: [{date,sets,best,vol}] ascendente */
function hist(k,upto){
  const out=[];
  Object.keys(DB.log).sort().forEach(d=>{
    if(upto&&d>=upto) return;
    const s=DB.log[d].ex&&DB.log[d].ex[k];
    if(!s) return;
    const b=bestSet(s); if(!b) return;
    let vol=0; s.forEach(x=>{if(x){const kg=nm(x.kg)||0,rp=nm(x.reps)||0; vol+=kg*rp;}});
    out.push({date:d,sets:s,best:b,vol});
  });
  return out;
}
const lastOf=k=>{const h=hist(k,TODAY()); return h.length?h[h.length-1]:null;};
function topRep(r){ const m=String(r).match(/(\d+)\s*-\s*(\d+)/); if(m) return +m[2];
  const s=String(r).match(/(\d+)/); return s?+s[1]:null; }
/* sugerencia de carga por doble progresión */
function sugg(ex,k){
  const l=lastOf(k); if(!l) return null;
  const top=topRep(ex.r); if(!top) return null;
  const done=l.sets.filter(s=>s&&nm(s.kg)&&nm(s.reps));
  if(done.length<ex.s) return {kg:l.best.kg,why:'repite'};
  const allTop=done.every(s=>nm(s.reps)>=top);
  if(allTop){ const inc=l.best.kg>=40?2.5:(l.best.kg>=20?2:1);
    return {kg:Math.round((l.best.kg+Math.max(inc,l.best.kg*.025))*2)/2,why:'sube'}; }
  return {kg:l.best.kg,why:'repite'};
}
/* estancamiento: sin mejora de e1RM en las 3 últimas sesiones */
function stalled(k){
  const h=hist(k); if(h.length<3) return false;
  const t=h.slice(-3).map(x=>x.best.e);
  return t[1]<=t[0]*1.005 && t[2]<=t[0]*1.005;
}
function prCheck(k,name){
  const h=hist(k); if(!h.length) return;
  const b=h[h.length-1].best, prev=DB.prs[k];
  if(!prev||b.e>prev.e*1.001){
    DB.prs[k]={kg:b.kg,reps:b.reps,e:b.e,date:h[h.length-1].date,name};
    return true;
  }
  return false;
}

/* --------------------------- volumen semanal --------------------------- */
function weekStart(d){ const x=dOf(d); const w=(x.getDay()+6)%7; return shift(d,-w); }
/* series efectivas por músculo en la semana que contiene d */
function volWeek(d){
  const ws=weekStart(d), acc={}; MUS.forEach(m=>acc[m]=0);
  let series=0, ton=0, sesiones=0;
  for(let i=0;i<7;i++){
    const day=shift(ws,i), L=DB.log[day]; if(!L||!L.ex) continue;
    let anySet=false;
    Object.keys(L.ex).forEach(k=>{
      const [m,dk,...rest]=k.split('|'), nme=rest.join('|');
      const D=dayObj(m==='abs'?'abs':'gym',dk);
      const ex=(D.e||[]).find(x=>x.n===nme);
      const done=(L.ex[k]||[]).filter(s=>s&&(nm(s.kg)||nm(s.reps))).length;
      if(!done) return;
      anySet=true; series+=done;
      (L.ex[k]||[]).forEach(s=>{if(s){ton+=(nm(s.kg)||0)*(nm(s.reps)||0);}});
      if(ex&&ex.m) Object.keys(ex.m).forEach(mu=>{acc[mu]=(acc[mu]||0)+ex.m[mu]*done;});
    });
    if(anySet) sesiones++;
  }
  return {ws,acc,series,ton,sesiones};
}

/* ------------------------------ calorías ------------------------------- */
function kcalOf(met,min,kg){ if(!met||!min||!kg) return 0; return met*3.5*kg/200*min; }
function lastWeight(upto){
  const ks=Object.keys(DB.body).filter(d=>DB.body[d]&&nm(DB.body[d].w)&&(!upto||d<=upto)).sort();
  return ks.length?nm(DB.body[ks[ks.length-1]].w):null;
}
function dayKcal(d){
  const L=DB.log[d]; if(!L) return 0;
  const w=lastWeight(d)||75; let k=0;
  if(L.box&&L.box.min) k+=kcalOf(+L.box.int||7.8,+L.box.min,w);
  if(L.gym) k+=kcalOf(MET.gym,L.gymMin||60,w);
  if(L.abs) k+=kcalOf(MET.abs,10,w);
  return Math.round(k);
}
function bmr(){
  const p=DB.profile, w=lastWeight(), h=nm(p.height), a=nm(p.age);
  if(!w||!h||!a) return null;
  const s=p.sex==='m'?-161:5;
  return Math.round(10*w+6.25*h-5*a+s);
}
function tdeeWeek(d){
  const b=bmr(); if(!b) return null;
  const ws=weekStart(d||TODAY()); let ex=0, n=0;
  for(let i=0;i<7;i++){ const dd=shift(ws,i); if(dd>TODAY()) break; ex+=dayKcal(dd); n++; }
  if(!n) return null;
  return Math.round(b*1.25+ex/n);
}
/* --------------------------- tendencia de peso -------------------------- */
function wSeries(){
  return Object.keys(DB.body).filter(d=>nm(DB.body[d]&&DB.body[d].w)).sort()
    .map(d=>({d,w:nm(DB.body[d].w)}));
}
function wMA(series,win=7){
  return series.map(p=>{
    const lo=shift(p.d,-(win-1));
    const sel=series.filter(q=>q.d>=lo&&q.d<=p.d);
    return {d:p.d,w:sel.reduce((a,b)=>a+b.w,0)/sel.length};
  });
}
/* %/semana sobre los últimos 28 días usando media móvil */
function wRate(){
  const ma=wMA(wSeries()); if(ma.length<2) return null;
  const last=ma[ma.length-1];
  const cand=ma.filter(p=>dif(last.d,p.d)>=10);
  const first=cand.length?cand[cand.length-1]:ma[0];
  const dd=dif(last.d,first.d); if(dd<7) return null;
  const pct=((last.w-first.w)/first.w)*100/(dd/7);
  return {pct,days:dd,from:first,to:last};
}
function wVerdict(){
  const r=wRate(); if(!r) return null;
  const p=r.pct;
  if(p<.1) return {cl:'warn',t:'Te has quedado corto de calorías',s:`Subes ${r1(p)} %/semana. Añade 250 kcal al día.`};
  if(p<=.55) return {cl:'ok',t:'Ritmo de ganancia correcto',s:`${r1(p)} %/semana está en el rango bueno. No cambies nada.`};
  if(p<=.8) return {cl:'warn',t:'Vas algo rápido',s:`${r1(p)} %/semana. Quita 150-200 kcal si la cintura sube.`};
  return {cl:'bad',t:'Demasiado rápido',s:`${r1(p)} %/semana. Buena parte no es músculo. Quita 300 kcal.`};
}
/* calidad de la ganancia: cintura vs peso */
function gainQuality(){
  const bs=Object.keys(DB.body).filter(d=>nm(DB.body[d].w)&&nm(DB.body[d].cintura)).sort();
  if(bs.length<2) return null;
  const a=DB.body[bs[0]], b=DB.body[bs[bs.length-1]];
  const dw=nm(b.w)-nm(a.w), dc=nm(b.cintura)-nm(a.cintura);
  if(Math.abs(dw)<.5) return null;
  const ratio=dc/dw;
  let cl='ok',t='Ganancia de calidad';
  if(ratio>1.2){cl='bad';t='Estás ganando sobre todo grasa';}
  else if(ratio>0.7){cl='warn';t='Ganancia mixta';}
  return {cl,t,s:`+${r1(dw)} kg de peso y ${dc>=0?'+':''}${r1(dc)} cm de cintura desde ${bs[0].slice(8)}/${bs[0].slice(5,7)}.`,dw,dc};
}
/* --------------------------- adherencia / racha ------------------------- */
function plannedDays(){ return plan().gym.filter(d=>d.e.length).length; }
function doneWeek(d){
  const ws=weekStart(d||TODAY()); let g=0,b=0,a=0;
  for(let i=0;i<7;i++){
    const dd=shift(ws,i), L=DB.log[dd]; if(!L) continue;
    if(L.gym||hasSets(dd,'gym')) g++;
    if(L.abs||hasSets(dd,'abs')) a++;
    if(L.box&&L.box.min) b++;
  }
  return {g,b,a};
}
function hasSets(d,m){
  const L=DB.log[d]; if(!L||!L.ex) return false;
  return Object.keys(L.ex).some(k=>k.startsWith(m+'|')&&(L.ex[k]||[]).some(s=>s&&(nm(s.kg)||nm(s.reps))));
}
function streak(){
  let n=0, d=TODAY();
  for(;;){ const L=DB.log[d];
    const act=L&&((L.box&&L.box.min)||L.gym||L.abs||hasSets(d,'gym')||hasSets(d,'abs'));
    if(act){n++; d=shift(d,-1);} else break;
    if(n>400) break;
  }
  return n;
}
function toast(m){
  const t=document.createElement('div');
  t.textContent=m;
  t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:99;'+
    'background:#1f1f2e;border:1px solid #33334a;color:#f3f0ee;padding:10px 15px;border-radius:11px;'+
    'font-size:13.5px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:88vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

/* ============================== gráficas =============================== */
function lineChart(pts,opt){
  opt=opt||{};
  const W=320,H=opt.h||150,PL=34,PR=8,PT=12,PB=18;
  if(!pts.length) return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">Sin datos todavía</text></svg>`;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(opt.series2&&opt.series2.length){mn=Math.min(mn,...opt.series2);mx=Math.max(mx,...opt.series2);}
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  if(opt.min!=null&&mn<opt.min) mn=opt.min;
  const X=i=>PL+(pts.length===1?0:(i/(pts.length-1))*(W-PL-PR));
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const col=opt.color||'#00e5ff';
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3, y=Y(v);
    g+=`<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`
      +`<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`;}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${d} L${X(pts.length-1).toFixed(1)},${H-PB} L${X(0).toFixed(1)},${H-PB} Z`;
  let ln2='';
  if(opt.series2&&opt.series2.length===pts.length){
    ln2=`<path class="ln" d="${opt.series2.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join(' ')}" stroke="${opt.color2||'#ff2d78'}" stroke-dasharray="5 4" stroke-width="2"/>`;
  }
  let dots=pts.map((p,i)=>(pts.length<=26||i===pts.length-1)
    ?`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?3.6:2.4}" fill="${col}"/>`:'').join('');
  const lab=(i)=>{const p=pts[i]; return p.l||(p.d?p.d.slice(8)+'/'+p.d.slice(5,7):'');};
  let xl=`<text x="${PL}" y="${H-5}">${lab(0)}</text>`;
  if(pts.length>1) xl+=`<text x="${W-PR}" y="${H-5}" text-anchor="end">${lab(pts.length-1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path class="ar" d="${area}" fill="${col}"/>`+
    `<path class="ln" d="${d}" stroke="${col}"/>${ln2}${dots}${xl}</svg>`;
}
function barsChart(items,opt){
  opt=opt||{};
  const W=320,H=opt.h||150,PL=34,PR=8,PT=12,PB=20;
  if(!items.length) return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">Sin datos todavía</text></svg>`;
  const mx=Math.max(...items.map(i=>i.v),1)*1.15;
  const bw=(W-PL-PR)/items.length;
  let g='';
  for(let i=0;i<=3;i++){const v=mx*i/3, y=PT+(1-i/3)*(H-PT-PB);
    g+=`<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`
      +`<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`;}
  const bars=items.map((it,i)=>{
    const h=(it.v/mx)*(H-PT-PB), x=PL+i*bw+bw*.16, w=bw*.68, y=H-PB-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2.5" fill="${it.c||opt.color||'#00e5ff'}"/>`
      +`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${it.l||''}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${bars}</svg>`;
}

      for(let s=0;s<ex.s;s++){
        const v=cur[s]||{};

            value="${v.reps??''}" data-k="${esc(k)}" data-s="${s}" data-f="reps" data-nm="${esc(ex.n)}"

      h+=`</div>${ex.o?`<div class="exnote">${esc(ex.o)}</div>`:''}</section>`;
    });
    h+=`<div class="banner">${esc(D.n)}</div>`;

      <input class="f" type="text" id="sNote" value="${esc(L.note||'')}" placeholder="Hombro derecho tirando en el press...">
      <div class="mini">Usa <b>Finalizar</b> arriba para cerrar la sesión de hoy cuando termines.</div></div>`;
  }
  h+=`<details class="block"><summary>Reglas que no se saltan</summary><ul>${
    REGLAS[mode].map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>`;
  return h;
}
function sessElapsed(){
  const L=DB.log[TODAY()]; if(!L||!L.start) return null;
  const base=L.end||Date.now();
  const paused=(L.paused||0)+(L.pauseAt?(base-L.pauseAt):0);
  return Math.max(0,Math.round((base-L.start-paused)/6e4));
}

/* ===================== sesión: finalizar / pausar ====================== */
function finSession(){
  const L=dlog(TODAY());
  if(L.pauseAt){ L.paused=(L.paused||0)+(Date.now()-L.pauseAt); L.pauseAt=null; }
  L.end=Date.now();
  L.gym = mode==='gym'||L.gym;
  L.abs = mode==='abs'||L.abs;
  save();
  const mins=sessElapsed()||0;   // L.end ya fijado → valor estable
  closeGuided();                 // no-op si el overlay está cerrado
  render();
  toast('Sesión cerrada. '+mins+' min');
}
function togglePause(){
  const L=dlog(TODAY());
  if(L.pauseAt){ L.paused=(L.paused||0)+(Date.now()-L.pauseAt); L.pauseAt=null; }
  else { L.pauseAt=Date.now(); }
  save();
  if(guidedOpen) paintGuidedHeader();   // overlay abierto: solo cabecera guiada
  else render();
}

/* ===================== modo entrenamiento guiado ======================= */
function openGuided(resume){
  const E=dayObj(mode,todayK()).e;
  if(!E.length){ toast('Hoy es descanso'); return; }
  const L=dlog(TODAY());
  if(!L.start){ L.start=Date.now(); save(); }
  gIdx = resume ? Math.min(gIdx, E.length-1) : 0;
  gRest=false;
  gDoneSet=new Set();
  E.forEach(ex=>{ const k=exK(mode,todayK(),ex.n); const arr=(L.ex||{})[k]||[];
    arr.forEach((v,s)=>{ if(v&&nm(v.kg)!=null&&nm(v.reps)!=null) gDoneSet.add(k+'|'+s); }); });
  guidedOpen=true;
  $('#guided').classList.remove('hide');
  document.body.style.overflow='hidden';
  paintGuided(); paintGuidedHeader();
  clearInterval(gTick); gTick=setInterval(tickGuidedClock,1000);
}
function closeGuided(){
  if(!guidedOpen) return;
  guidedOpen=false;
  clearInterval(gTick); gTick=null;
  clearInterval(gRestTick); gRestTick=null;
  gRest=false;
  $('#guided').classList.add('hide');
  document.body.style.overflow='';
}
function gClockSeg(){
  const L=DB.log[TODAY()]; if(!L||!L.start) return 0;
  const base=L.end||Date.now();
  const pausedMs=(L.paused||0)+(L.pauseAt?(base-L.pauseAt):0);
  return Math.max(0,Math.round((base-L.start-pausedMs)/1000));
}

function buildReport(){
  const c=cyc(), f=fase(), vw=volWeek(TODAY()), rate=wRate(), vd=wVerdict(), gq=gainQuality();
  const bm=bmr(), td=tdeeWeek(), list=allExNames();
  const L=[];
  L.push('# Informe de evolución · '+TODAY());
  L.push('');
  L.push('## Situación');
  L.push('- Bloque: '+DB.blocks[DB.ab].name+(c?' · semana '+c.w+' de 9 · '+f.n+' ('+f.rir+')':' · ciclo sin fecha de inicio'));
  L.push('- Racha en activo: '+streak()+' días');
  const dw=doneWeek();
  L.push('- Esta semana: '+dw.g+'/'+plannedDays()+' gimnasio, '+dw.b+' boxeo, '+dw.a+' abdomen');
  const ad=[]; for(let i=5;i>=0;i--){const ws=shift(weekStart(TODAY()),-7*i); let g=0;
    for(let j=0;j<7;j++){const d=shift(ws,j); if((DB.log[d]&&DB.log[d].gym)||hasSets(d,'gym'))g++;} ad.push(g);}
  L.push('- Gimnasio por semana (6 últimas, la última es la actual): '+ad.join(', ')+' de '+plannedDays());
  L.push('');
  L.push('## Cuerpo');
  const ser=wSeries(), ma=wMA(ser);
  if(ser.length){
    L.push('- Peso actual (media 7 días): '+r1(ma[ma.length-1].w)+' kg · último pesaje '+r1(ser[ser.length-1].w)+' kg');
    L.push('- Pesajes registrados: '+ser.length+' desde '+ser[0].d);
  } else L.push('- Sin pesajes registrados');
  if(rate) L.push('- Ritmo: '+(rate.pct>0?'+':'')+r1(rate.pct)+' % por semana sobre '+rate.days+' días');
  if(vd) L.push('- Veredicto de ritmo: '+vd.t+'. '+vd.s);
  if(gq) L.push('- Calidad de la ganancia: '+gq.t+'. '+gq.s);
  MEAS.slice(1).forEach(([k,lb,u])=>{
    const s=Object.keys(DB.body).filter(d=>nm(DB.body[d][k])).sort();
    if(s.length<2) return;
    const a=nm(DB.body[s[0]][k]), b=nm(DB.body[s[s.length-1]][k]);
    L.push('- '+lb+': '+a+' → '+b+' '+u+' ('+(b-a>=0?'+':'')+r1(b-a)+')');
  });
  if(bm) L.push('- Basal '+bm+' kcal · gasto diario estimado '+(td||'–')+' kcal · objetivo '+(td?td+ +DB.profile.surplus:'–')+' kcal');
  L.push('');
  L.push('## Volumen semanal por músculo (series efectivas)');
  MUS.forEach(mu=>{ const v=vw.acc[mu]; if(!v) return;
    const [lo,hi]=MUST[mu];
    L.push('- '+MUSL[mu]+': '+r1(v)+' (objetivo '+lo+'-'+hi+')'+(v<lo?' · POR DEBAJO':(v>hi?' · POR ENCIMA':'')));
  });
  L.push('- Series totales: '+vw.series+' · tonelaje: '+Math.round(vw.ton)+' kg');
  L.push('');
  L.push('## Progresión por ejercicio');
  if(!list.length) L.push('- Sin datos todavía');
  list.forEach(x=>{
    const h=hist(x.k); if(!h.length) return;
    const a=h[0].best, b=h[h.length-1].best;
    const pc=a.e?((b.e-a.e)/a.e*100):0;
    L.push('- '+x.n+': '+h.length+' sesiones · '+a.kg+'×'+a.reps+' → '+b.kg+'×'+b.reps+
      ' · 1RM est. '+r1(a.e)+' → '+r1(b.e)+' ('+(pc>=0?'+':'')+r1(pc)+' %)'+(stalled(x.k)?' · ESTANCADO':''));
  });
  const stl=list.filter(x=>stalled(x.k));
  L.push('');
  L.push('## Avisos');
  L.push(stl.length?'- Estancados: '+stl.map(x=>x.n).join('; '):'- Sin estancamientos detectados');
  const notes=Object.keys(DB.log).filter(d=>DB.log[d].note).sort().slice(-10);
  if(notes.length){ L.push('- Notas recientes:');
    notes.forEach(d=>L.push('  - '+d+': '+DB.log[d].note)); }
  const rpes=Object.keys(DB.log).filter(d=>DB.log[d].rpe).sort().slice(-8);
  if(rpes.length) L.push('- Esfuerzo percibido reciente: '+rpes.map(d=>DB.log[d].rpe).join(', ')+'/10');
  L.push('');
  L.push('## Carga de boxeo (4 últimas semanas)');
  for(let i=3;i>=0;i--){
    const ws=shift(weekStart(TODAY()),-7*i); let min=0,ses=0,kc=0;
    for(let j=0;j<7;j++){const d=shift(ws,j),Lg=DB.log[d];
      if(Lg&&Lg.box&&Lg.box.min){min+=+Lg.box.min;ses++;} if(Lg)kc+=dayKcal(d);}
    L.push('- Semana '+(i===0?'actual':'-'+i)+': '+ses+' sesiones, '+min+' min, '+kc+' kcal estimadas (todo el entreno)');
  }
  return L.join('\n');
}

function dl(name,txt,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:type||'text/plain;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportCsv(){
  const rows=[['Fecha','Modo','Dia','Ejercicio','Serie','kg','Reps','e1RM']];
  Object.keys(DB.log).sort().forEach(d=>{
    const ex=DB.log[d].ex||{};
    Object.keys(ex).forEach(k=>{
      const [m,dk,...rest]=k.split('|'), n=rest.join('|');
      (ex[k]||[]).forEach((s,i)=>{ if(!s) return;
        const kg=nm(s.kg), rp=nm(s.reps); if(!kg&&!rp) return;
        rows.push([d,m,dk,n,i+1,kg??'',rp??'',(kg&&rp)?r1(e1rm(kg,rp)):'']);
      });
    });
  });
  const b=[['Fecha','Peso','Cintura','Pecho','Brazo','Muslo','Hombros','Cuello','Cadera']];
  Object.keys(DB.body).sort().forEach(d=>{const o=DB.body[d];
    b.push([d,o.w??'',o.cintura??'',o.pecho??'',o.brazo??'',o.muslo??'',o.hombros??'',o.cuello??'',o.cadera??'']);});
  const q=r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';');
  const csv=['SERIES'].concat(rows.map(q)).concat(['','MEDIDAS']).concat(b.map(q)).join('\r\n');
  if(rows.length===1&&b.length===1){toast('Todavía no hay nada registrado.');return;}
  dl('registro_entreno_'+TODAY()+'.csv',csv,'text/csv;charset=utf-8');
}

document.addEventListener('click',e=>{
  const t=e.target;
  const rb=t.closest('.rest'); if(rb){ startTimer(+rb.dataset.rest||90); return; }
  const th=t.closest('.thumb[data-ic], .g-exobig[data-ic]'); if(th){
    const d=th.dataset;
    const m=(()=>{ try{ return JSON.parse(d.m||'{}'); }catch(e){ return {}; } })();
    const mu=muscles(m);
    openExo(d.ic, d.n, d.s, d.r, d.t, d.o, mu);
    return;
  }
  if(t.id==='bPause'){ togglePause(); return; }
  if(t.id==='bFin'){ finSession(); return; }
  if(t.id==='bGuided'){ openGuided(!!dlog(TODAY()).start); return; }
  if(t.id==='gClose'){ closeGuided(); render(); return; }
  if(t.id==='gPause'){ togglePause(); return; }
  if(t.id==='gFin'){ finSession(); return; }
  if(t.id==='gSkip'){ clearInterval(gRestTick); gRestTick=null; gRest=false; paintGuided(); return; }
  if(t.id==='gPrev'){ gIdx=Math.max(0,gIdx-1); gRest=false; clearInterval(gRestTick); gRestTick=null; paintGuided(); paintGuidedHeader(); return; }
  if(t.id==='gNext'){ const M=dayObj(mode,todayK()).e.length;
    if(gIdx>=M-1){ finSession(); return; }
    gIdx++; gRest=false; clearInterval(gRestTick); gRestTick=null; paintGuided(); paintGuidedHeader(); return; }
  const cd=t.closest('.cd[data-d]'); if(cd){ openDay(cd.dataset.d); return; }
  if(t.id==='cPrev'){ calM.m--; if(calM.m<0){calM.m=11;calM.y--;} render(); return; }
  if(t.id==='cNext'){ calM.m++; if(calM.m>11){calM.m=0;calM.y++;} render(); return; }
  const ch=t.closest('.chip[data-ex]'); if(ch){ proEx=ch.dataset.ex; render(); return; }
  if(t.id==='bRep'){ $('#repTxt').value=buildReport(); $('#dRep').showModal(); return; }
  if(t.id==='bCsv'){ exportCsv(); return; }
  if(t.dataset.act!=null){ DB.ab=+t.dataset.act; save(); render(); return; }
  if(t.dataset.del!=null){
    const i=+t.dataset.del;
    if(DB.blocks.length<=1){ toast('No puedes eliminar el único bloque'); return; }
    if(!confirm('Eliminar el bloque "'+DB.blocks[i].name+'"? Se borra su plan. El registro de series y medidas no se toca.')) return;
    DB.blocks.splice(i,1);
    if(DB.ab>i) DB.ab--; else if(DB.ab===i) DB.ab=Math.max(0,i-1);
    if(DB.ab>DB.blocks.length-1) DB.ab=DB.blocks.length-1;
    save(); render(); toast('Bloque eliminado'); return; }
  if(t.dataset.edit!=null){ openEd(+t.dataset.edit); return; }
  if(t.id==='bNewDup'){
    const cp=JSON.parse(JSON.stringify(DB.blocks[DB.ab]));
    cp.id=Date.now(); cp.name='Copia de '+cp.name; cp.start=TODAY();
    DB.blocks.push(cp); DB.ab=DB.blocks.length-1; save(); render(); toast('Bloque duplicado'); return; }
  if(t.id==='bBk'){ navigator.clipboard.writeText(backupPackage())
    .then(()=>toast('Copia del perfil en el portapapeles')).catch(()=>{$('#pImp').value=backupPackage();toast('Copia en el cuadro de texto');}); return; }
  if(t.id==='bBkD'){ dl('copia_'+slug(prof().name)+'_'+TODAY()+'.json',backupPackage(),'application/json'); return; }
  if(t.id==='bImp'){
    if(!MOUNTED || profIdx()<0){ toast('No se pudo restaurar'); return; }
    try{ const o=JSON.parse($('#pImp').value); if(!o||typeof o!=='object') throw 0;
      let d, nm=prof().name, ph=prof().photo;
      if(o.mp===1 && o.db){ d=o.db;
        if(typeof o.name==='string'&&o.name.trim()) nm=o.name.trim().slice(0,40);
        if(typeof o.photo==='string' && /^data:image\//.test(o.photo)) ph=o.photo; }
      else { d=o; }
      d=Object.assign(blankDB(), d); ensureDB(d);
      if(!d.migrated){ migrateInto(d); d.migrated=1; }
      prof().db=d; DB=d; prof().name=nm; prof().photo=ph;
      save(); render(); toast('Perfil restaurado');
    }catch(err){ toast('Ese texto no es una copia válida'); } return; }
  if(t.id==='bWipe'){
    if(!confirm('Esto borra los datos de ESTE perfil ("'+prof().name+'"): registro, medidas y bloques. ¿Seguro?')) return;
    if(!confirm('No se puede deshacer. ¿Confirmas?')) return;
    const keep=prof(); keep.db=blankDB(); DB=keep.db;
    save(); render(); toast('Datos del perfil borrados'); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pAge'){DB.profile.age=nm(t.value);save();render();}
  if(t.id==='pH'){DB.profile.height=nm(t.value);save();render();}
  if(t.id==='pSex'){DB.profile.sex=t.value;save();render();}
  if(t.id==='pSur'){DB.profile.surplus=nm(t.value)||450;save();render();}
  if(t.id==='pCs'){DB.profile.cycleStart=t.value;save();render();}
  if(t.id==='pName'){ renameProfile(t.value); }
  if(t.id==='pPhoto'){ const f=t.files&&t.files[0]; processPhoto(f, data=>{ if(data){ prof().photo=data; save(); render(); } }); }
});

/* --------- día del calendario --------- */
let ddDate=null;
function ddKcalTxt(){
  const w=lastWeight(ddDate)||nm(DB.profile.weight)||75;
  const min=nm($('#ddBoxMin').value)||0, int=+$('#ddBoxInt').value||0;
  let k=kcalOf(int,min,w);
  if($('#ddGym').checked) k+=kcalOf(MET.gym,60,w);
  if($('#ddAbs').checked) k+=kcalOf(MET.abs,10,w);
  const txt=min&&int?`${Math.round(kcalOf(int,min,w))} kcal de boxeo`:'sin boxeo';
  $('#ddKcal').innerHTML=`<b>${Math.round(k)} kcal</b> estimadas ese día · ${txt}`+
    (lastWeight(ddDate)?'':' · <span style="color:var(--warn)">usa 75 kg porque no hay peso registrado</span>');
}
function openDay(d){
  ddDate=d; const L=DB.log[d]||{};
  const dd=dOf(d);
  $('#ddTitle').textContent=DLN[(dd.getDay()+6)%7]+' '+dd.getDate()+' de '+MN[dd.getMonth()];
  $('#ddSub').textContent=d===TODAY()?'Hoy':(d>TODAY()?'Día futuro: puedes planificarlo':'');
  $('#ddBoxInt').value=String((L.box&&L.box.int)||7.8);
  $('#ddBoxMin').value=(L.box&&L.box.min)||'';
  $('#ddGym').checked=!!(L.gym||hasSets(d,'gym'));
  $('#ddAbs').checked=!!(L.abs||hasSets(d,'abs'));
  $('#ddNote').value=L.note||'';
  ddKcalTxt(); $('#dDay').showModal();
}
['ddBoxMin','ddBoxInt','ddGym','ddAbs'].forEach(id=>{
  const el=$('#'+id); el.addEventListener('input',ddKcalTxt); el.addEventListener('change',ddKcalTxt);
});
$('#ddSave').onclick=()=>{
  const L=dlog(ddDate);
  const min=nm($('#ddBoxMin').value)||0, int=+$('#ddBoxInt').value||0;
  if(min&&int) L.box={min,int}; else delete L.box;
  L.gym=$('#ddGym').checked; L.abs=$('#ddAbs').checked;
  const n=$('#ddNote').value.trim(); if(n) L.note=n; else delete L.note;
  save(); $('#dDay').close(); render();
};
$('#ddClose').onclick=()=>$('#dDay').close();

/* --------- editor --------- */
$('#dEd').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='edMg'){edCollect();edMode='gym';edDay=0;renderEd();}
  if(t.id==='edMa'){edCollect();edMode='abs';edDay=0;renderEd();}

  if(t.dataset.del!=null){edCollect();

  if(t.dataset.mv!=null){edCollect();
    const arr=DB.blocks[edIdx].plan[edMode][edDay].e, i=+t.dataset.mv, j=i+(+t.dataset.dir);
    if(j>=0&&j<arr.length){const x=arr[i];arr[i]=arr[j];arr[j]=x;} renderEd();}

/* --------- cronómetro --------- */
let tEnd=0,tInt=null,actx=null;
const tdisp=$('#tdisp');
function paint(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  tdisp.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left<=0){clearInterval(tInt);tInt=null;tdisp.className='tdisp done';beep();
    if(navigator.vibrate)navigator.vibrate([200,100,200]);}
}
/* iOS exige que el contexto de audio nazca (y se reanude) dentro de un toque */
function unlockAudio(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(!actx._warm){
      const o=actx.createOscillator(),g=actx.createGain();
      g.gain.value=0.0001; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+.02); actx._warm=1;
    }
  }catch(e){}
}
document.addEventListener('touchend',unlockAudio,{once:true,passive:true});
document.addEventListener('click',unlockAudio,{once:true});
function startTimer(sec){
  if(!sec) return;
  unlockAudio();
  tEnd=Date.now()+sec*1000; tdisp.className='tdisp run';
  clearInterval(tInt); paint(); tInt=setInterval(paint,250);
  if(navigator.vibrate)navigator.vibrate(30);
}
function beep(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [0,.22,.44].forEach(t=>{ const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(.001,actx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.16);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.18); });
  }catch(e){}
}
$$('.timerbar button[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#tstop').onclick=()=>{clearInterval(tInt);tInt=null;tdisp.className='tdisp';tdisp.textContent='0:00';};
